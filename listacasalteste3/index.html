<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lista de presentes</title><style>:root{--p:#A18ACB;--s:#C9FFF0;--bg:#fbf9fd;--ink:#393244;--muted:#777083;--line:#e8e1f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Georgia,serif}header{text-align:center;background:white;border-bottom:1px solid var(--line);padding-bottom:28px}#cover{width:100%;max-height:420px;object-fit:cover;display:none}.intro{padding:28px 18px 0}.eyebrow{font:700 11px Arial;letter-spacing:3px;color:var(--p)}h1{font-size:clamp(34px,7vw,58px);font-weight:400;color:var(--p);margin:10px 0}header p{max-width:650px;margin:12px auto;color:var(--muted);white-space:pre-line}main{max-width:1000px;margin:30px auto;padding:0 16px 60px}.bar{display:flex;gap:10px;flex-wrap:wrap}.bar input,.bar select,dialog input{padding:12px;border:1px solid var(--line);border-radius:9px;font:14px Arial}.bar input{flex:1;min-width:190px}.stats{font:13px Arial;color:var(--muted);margin:14px 0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.gift{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}.gift img{width:100%;height:145px;object-fit:cover;border-radius:9px}.gift h3{margin:0;font-size:19px;font-weight:400}.desc{font:13px Arial;color:var(--muted)}.tag{font:11px Arial;color:#287454}.off{color:#8b7770}button{border:0;border-radius:9px;padding:12px;background:var(--p);color:white;font-weight:700;cursor:pointer}button:disabled{background:#e7e2eb;color:#817b89}dialog{border:0;border-radius:15px;padding:22px;width:min(92vw,410px);box-shadow:0 15px 70px #0003}dialog::backdrop{background:#0008}dialog input{width:100%;margin:8px 0 14px}menu{display:flex;justify-content:flex-end;gap:8px;padding:0}.secondary{background:var(--s);color:#31564e}.notice{text-align:center;color:var(--muted);padding:25px}footer{text-align:center;padding:22px;color:#999;font:12px Arial}@media(max-width:560px){.grid{grid-template-columns:1fr 1fr;gap:8px}.gift{padding:11px}.gift h3{font-size:16px}.gift img{height:105px}}</style></head><body><header><img id="cover" alt="Capa da lista"><div class="intro"><div class="eyebrow">LISTA DE PRESENTES</div><h1 id="couple">Carregando...</h1><p id="message"></p></div></header><main><div class="bar"><input id="search" placeholder="Buscar presente"><select id="filter"><option value="todos">Todos</option><option value="disponivel">Disponíveis</option><option value="indisponivel">Indisponíveis</option></select></div><div id="stats" class="stats">Carregando...</div><div id="list" class="grid"></div><p id="notice" class="notice" hidden></p></main><dialog id="dlg"><form id="form"><h2>Reservar presente</h2><p id="chosen"></p><label>Seu nome</label><input id="guest" required minlength="2" maxlength="100"><p id="msg"></p><menu><button type="button" class="secondary" id="cancel">Cancelar</button><button id="confirm">Confirmar</button></menu></form></dialog><footer>Com carinho</footer><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const sb=createClient('https://ziqhqqogwhygpifnfnvu.supabase.co','sb_publishable_VctACA1BGNYV_wHrdMNuvg_ge87IJQW'),SLUG='casal-teste-3-ebfc24c7',$=s=>document.querySelector(s);let items=[],selected=null,busy=false;function draw(){const q=$('#search').value.toLocaleLowerCase('pt-BR').trim(),f=$('#filter').value,shown=items.filter(x=>(f==='todos'||x.status===f)&&x.nome.toLocaleLowerCase('pt-BR').includes(q));$('#list').replaceChildren();$('#stats').textContent=items.length+' presentes • '+items.filter(x=>x.status==='disponivel').length+' disponíveis • '+items.filter(x=>x.status==='indisponivel').length+' indisponíveis';$('#notice').hidden=shown.length>0;$('#notice').textContent='Nenhum presente encontrado.';for(const p of shown){const c=document.createElement('article');c.className='gift';if(p.imagem_url){const im=document.createElement('img');im.src=p.imagem_url;im.alt=p.nome;c.append(im)}const t=document.createElement('div');t.className='tag '+(p.status==='indisponivel'?'off':'');t.textContent=p.status==='disponivel'?'● Disponível':'● Indisponível';const h=document.createElement('h3');h.textContent=p.nome;c.append(t,h);if(p.descricao){const d=document.createElement('p');d.className='desc';d.textContent=p.descricao;c.append(d)}const b=document.createElement('button');b.textContent=p.status==='disponivel'?'Vou presentear':'Já escolhido';b.disabled=p.status!=='disponivel';b.onclick=()=>{selected=p;$('#chosen').textContent=p.nome;$('#guest').value='';$('#msg').textContent='';$('#dlg').showModal()};c.append(b);$('#list').append(c)}}async function load(){const{data,error}=await sb.rpc('obter_lista_publica',{p_slug:SLUG});if(error||!data||!data.lista){$('#stats').textContent='Não foi possível carregar esta lista.';$('#notice').hidden=false;$('#notice').textContent='Verifique o link ou tente mais tarde.';return}const l=data.lista;document.title=l.nome_casal+' | Lista de Presentes';$('#couple').textContent=l.nome_casal;$('#message').textContent=l.mensagem||'Sua presença é o nosso maior presente!';document.documentElement.style.setProperty('--p',l.cor_principal||'#A18ACB');document.documentElement.style.setProperty('--s',l.cor_secundaria||'#C9FFF0');if(l.imagem_capa_url){$('#cover').src=l.imagem_capa_url;$('#cover').style.display='block'}items=Array.isArray(data.presentes)?data.presentes:[];draw()}$('#search').oninput=draw;$('#filter').onchange=draw;$('#cancel').onclick=()=>$('#dlg').close();$('#form').onsubmit=async e=>{e.preventDefault();if(busy||!selected)return;const name=$('#guest').value.trim();if(name.length<2||name.length>100)return;busy=true;$('#confirm').disabled=true;$('#msg').textContent='Confirmando...';try{const{data,error}=await sb.rpc('reservar_presente_lista',{p_slug:SLUG,p_presente_id:selected.id,p_nome:name});if(error)throw error;$('#dlg').close();await load();alert(data===true?'Presente reservado com sucesso!':'Este presente já foi escolhido.')}catch(e){$('#msg').textContent='Não foi possível reservar. Tente novamente.'}finally{busy=false;$('#confirm').disabled=false}};load();</script></body></html>
