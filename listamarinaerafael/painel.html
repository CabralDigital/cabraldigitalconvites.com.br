<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel dos noivos | Cabral Digital</title><style>:root{--p:#A18ACB;--line:#e8e1f0;--ink:#393244;--muted:#777083}*{box-sizing:border-box}body{margin:0;background:#f8f6fb;color:var(--ink);font:15px/1.5 system-ui}.top{background:var(--p);color:white;padding:25px 18px}.wrap{max-width:900px;margin:auto;padding:24px 16px 50px}.brand{font-size:12px;letter-spacing:2px;font-weight:800}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}h1{margin:5px 0 8px;font-size:30px}h2{margin:0 0 12px}.muted{color:var(--muted)}label{display:block;font-weight:700;font-size:13px;margin:12px 0 5px}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;font:inherit}button{border:0;border-radius:9px;padding:12px 16px;background:var(--p);color:white;font-weight:700;cursor:pointer}.soft{background:#eeeaf4;color:#554c64}.actions{display:flex;gap:9px;margin-top:14px}.msg{padding:11px;border-radius:9px;background:#f2edfa;margin-top:12px}.err{background:#fff0ef;color:#923d39}.hidden{display:none!important}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#f5f1fa;border-radius:11px;padding:12px 16px}.stat strong{display:block;font-size:23px}.res{padding:14px 0;border-bottom:1px solid var(--line)}.res:last-child{border:0}small{color:var(--muted)}footer{text-align:center;color:#999;font-size:12px;padding:18px}</style></head><body><header class="top"><div class="wrap" style="padding-top:0;padding-bottom:0"><div class="brand">CABRAL DIGITAL</div><h1>Painel dos noivos</h1>Área privada da lista de presentes</div></header><main class="wrap"><section id="login" class="card"><h2>Entrar na sua lista</h2><p class="muted">Use o e-mail e a senha fornecidos pela administradora.</p><form id="loginForm"><label>E-mail</label><input id="email" type="email" required autocomplete="username"><label>Senha</label><input id="password" type="password" required autocomplete="current-password"><div class="actions"><button id="loginBtn">Entrar</button></div><div id="loginMsg" class="msg hidden"></div></form></section><section id="panel" class="hidden"><div class="card"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><h1 id="couple"></h1><p id="date" class="muted"></p></div><button class="soft" id="logout">Sair</button></div><div class="stats"><div class="stat"><strong id="total">0</strong>Reservas</div></div></div><div class="card"><h2>Presentes escolhidos</h2><div id="reservations"></div><p id="empty" class="muted hidden">Ainda não há presentes reservados.</p></div></section><div id="pageMsg" class="msg hidden"></div></main><footer>Cabral Digital • Painel privado</footer><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const sb=createClient('https://ziqhqqogwhygpifnfnvu.supabase.co','sb_publishable_VctACA1BGNYV_wHrdMNuvg_ge87IJQW'),SLUG='marina-rafael-b9d84345',$=s=>document.querySelector(s);function say(t,err=false){$('#pageMsg').textContent=t;$('#pageMsg').className='msg'+(err?' err':'');$('#pageMsg').classList.remove('hidden')}async function load(){const{data,error}=await sb.rpc('obter_painel_lista',{p_slug:SLUG});if(error||!data||!data.lista){say('Esta conta não está vinculada a esta lista ou não foi possível carregar o painel.',true);return false}$('#pageMsg').classList.add('hidden');$('#pageMsg').textContent='';$('#couple').textContent=data.lista.nome_casal;$('#date').textContent=data.lista.data_evento?new Date(data.lista.data_evento+'T12:00:00').toLocaleDateString('pt-BR'):'Data não informada';const rows=Array.isArray(data.reservas)?data.reservas:[];$('#total').textContent=rows.length;$('#reservations').replaceChildren();$('#empty').classList.toggle('hidden',rows.length>0);for(const r of rows){const d=document.createElement('div');d.className='res';const b=document.createElement('b');b.textContent=r.presente||'Presente';const g=document.createElement('div');g.textContent='Convidado: '+(r.convidado||'Não informado');const when=document.createElement('small');const dt=r.data?new Date(r.data):null;when.textContent=dt&&!Number.isNaN(dt.getTime())?'Reservado em '+dt.toLocaleString('pt-BR'):'Data não informada';d.append(b,g,when);const cancel=document.createElement('button');cancel.type='button';cancel.className='soft';cancel.textContent='Cancelar reserva';cancel.style.marginTop='10px';if(r.reserva_id==null){cancel.disabled=true;cancel.textContent='ID da reserva não recebido'}else{cancel.onclick=async()=>{if(!confirm('Deseja cancelar esta reserva? O presente ficará disponível novamente para os convidados.'))return;cancel.disabled=true;cancel.textContent='Cancelando...';const{data,error}=await sb.rpc('cancelar_reserva_lista',{p_reserva_id:r.reserva_id});if(error||data!==true){cancel.disabled=false;cancel.textContent='Cancelar reserva';say(error?'Não foi possível cancelar a reserva: '+error.message:'A reserva não foi cancelada. Atualize o painel e tente novamente.',true);return}say('Reserva cancelada. O presente voltou a ficar disponível.');await load()}};d.append(cancel);$('#reservations').append(d)}$('#login').classList.add('hidden');$('#panel').classList.remove('hidden');return true}$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginBtn').disabled=true;$('#loginMsg').textContent='Entrando...';const{error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});$('#loginBtn').disabled=false;if(error){$('#loginMsg').textContent='E-mail ou senha não conferem.';$('#loginMsg').classList.remove('hidden');return}if(!(await load())){await sb.auth.signOut();$('#panel').classList.add('hidden');$('#login').classList.remove('hidden')}};$('#logout').onclick=async()=>{await sb.auth.signOut();$('#panel').classList.add('hidden');$('#login').classList.remove('hidden')};const{data:{session}}=await sb.auth.getSession();if(session)await load();</script></body></html>
